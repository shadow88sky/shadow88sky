<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">徐晨 Chen Xu — AI Product and Full-Stack Engineer</title>
  <desc id="desc">A dark blue profile banner with a geometric grid and project delivery message.</desc>
  <defs>
    <linearGradient id="background" x1="76" y1="20" x2="1120" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0A1E35"/>
      <stop offset="1" stop-color="#102E4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="74" x2="744" y2="287" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66E3FF"/>
      <stop offset="1" stop-color="#7C9CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1002 54) rotate(131.662) scale(321.455 380.652)">
      <stop stop-color="#2878B8" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#B7D9F5" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <path d="M78 74H266" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="78" y="126" fill="#EAF6FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="650" letter-spacing="4">徐晨 / CHEN XU</text>
  <text x="76" y="196" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="760" letter-spacing="-1.6">AI PRODUCT &amp; FULL-STACK</text>
  <text x="78" y="246" fill="#9DC0D9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="450" letter-spacing="1.3">FROM BUSINESS IDEA TO RELIABLE SOFTWARE</text>

  <g transform="translate(910 88)">
    <circle cx="90" cy="90" r="72" stroke="#66E3FF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="90" cy="90" r="48" stroke="#7C9CFF" stroke-opacity="0.36" stroke-width="2"/>
    <circle cx="90" cy="90" r="13" fill="#66E3FF" fill-opacity="0.22" filter="url(#softGlow)"/>
    <circle cx="90" cy="90" r="6" fill="#9CEBFF"/>
    <path d="M90 18V52M90 128V162M18 90H52M128 90H162" stroke="#B6EFFF" stroke-opacity="0.54" stroke-width="2" stroke-linecap="round"/>
    <path d="M39 39L63 63M117 117L141 141M141 39L117 63M63 117L39 141" stroke="#8EAEFF" stroke-opacity="0.36" stroke-width="2" stroke-linecap="round"/>
    <circle cx="90" cy="18" r="4" fill="#66E3FF"/>
    <circle cx="162" cy="90" r="4" fill="#7C9CFF"/>
    <circle cx="90" cy="162" r="4" fill="#66E3FF"/>
    <circle cx="18" cy="90" r="4" fill="#7C9CFF"/>
  </g>

  <g transform="translate(78 292)">
    <rect width="142" height="34" rx="17" fill="#66E3FF" fill-opacity="0.1" stroke="#66E3FF" stroke-opacity="0.32"/>
    <text x="71" y="22" text-anchor="middle" fill="#B8F2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="1.2">AI ENGINEERING</text>
    <rect x="154" width="126" height="34" rx="17" fill="#7C9CFF" fill-opacity="0.1" stroke="#7C9CFF" stroke-opacity="0.32"/>
    <text x="217" y="22" text-anchor="middle" fill="#C6D0FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="1.2">NODE.JS</text>
    <rect x="292" width="146" height="34" rx="17" fill="#66E3FF" fill-opacity="0.1" stroke="#66E3FF" stroke-opacity="0.32"/>
    <text x="365" y="22" text-anchor="middle" fill="#B8F2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="1.2">TYPESCRIPT</text>
    <rect x="450" width="164" height="34" rx="17" fill="#7C9CFF" fill-opacity="0.1" stroke="#7C9CFF" stroke-opacity="0.32"/>
    <text x="532" y="22" text-anchor="middle" fill="#C6D0FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="1.2">PRODUCT DELIVERY</text>
  </g>
</svg>
